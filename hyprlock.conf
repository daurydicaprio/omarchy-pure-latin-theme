# ------------------------------------------------------------
# Pure-Latin v5.3 - Hyprlock (Industrial Native)
# ------------------------------------------------------------

general {
    no_fade_in = false
    no_fade_out = false
    grace = 0
    disable_loading = true
}

background {
    monitor =
    path = screenshot
    color = rgba(7, 8, 10, 1.0)
    blur_passes = 3
    blur_size = 6
}

# Typography
label {
    monitor =
    text = $TIME
    color = rgba(226, 228, 233, 1.0)
    font_size = 110
    font_family = Inter, JetBrainsMono Nerd Font ExtraBold
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = ──────────────────────────
    color = rgba(255, 255, 255, 0.2)
    font_size = 12
    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "<b>$(date +"%A")</b> | $(date +"%d %b") | <span foreground='##5C6B7C'>$(date +"%V")</span>"
    color = rgba(226, 228, 233, 1.0)
    font_size = 18
    font_family = Inter, JetBrainsMono Nerd Font
    position = 0, 20
    halign = center
    valign = center
}

# Pure-Latin Input Field
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    outer_color = rgba(255, 255, 255, 0.8)
    inner_color = rgba(7, 8, 10, 0.9)
    font_color = rgba(226, 228, 233, 1.0)

    check_color = rgba(92, 107, 92, 1.0)
    fail_color = rgba(140, 92, 92, 1.0)
    fail_text = <i>Invalid ($ATTEMPTS)</i>
    fail_transition = 300

    fade_on_empty = false
    rounding = 0
    placeholder_text = <i>Password</i>

    position = 0, -180
    halign = center
    valign = center
}
