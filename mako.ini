# ------------------------------------------------------------
# Pure-Latin v5.3 - Mako Notification Handler
# Restored Full Omarchy System Integration
# ------------------------------------------------------------

# Core UI
anchor=top-right
default-timeout=5000
width=420
outer-margin=20
padding=10,15
border-size=2
border-radius=0
max-icon-size=48

# Dark Industrial Colors
background-color=#07080AEF
text-color=#E2E4E9
border-color=#FFFFFF
progress-color=over #FFFFFF

# Typography
font=Inter, Roboto, Sans, JetBrainsMono Nerd Font 12

# ------------------------------------------------------------
# Omarchy System Integration (CRITICAL)
# ------------------------------------------------------------

[app-name=Spotify]
invisible=1

[mode=do-not-disturb]
invisible=true

[mode=do-not-disturb app-name=notify-send]
invisible=false

[urgency=critical]
default-timeout=0
layer=overlay
border-color=#8C5C5C

# Omarchy Action Handlers
[summary~="Setup Wi-Fi"]
on-button-left=exec sh -c 'omarchy-notification-dismiss "Setup Wi-Fi"; omarchy-launch-wifi'

[summary~="Update System"]
on-button-left=exec sh -c 'omarchy-notification-dismiss "Update System"; omarchy-launch-floating-terminal-with-presentation omarchy-update'

[summary~="Learn Keybindings"]
on-button-left=exec sh -c 'omarchy-notification-dismiss "Learn Keybindings"; omarchy-menu-keybindings'
